# Fresh-machine smoke test: exactly what a new user runs, on a machine that has
# nothing, then the whole self-check suite. Catches the "works on the author's
# machine" class — a missing dependency, a retired script still being called
# (this workflow kept calling the silhouette script 1.3.2 deleted, and was red
# on every push), a calibration sample the engine has started refusing.
#
# Everything the suite checks lives in tools/test.sh so a developer runs the
# same thing locally: `bash setup.sh && bash tools/test.sh`.
name: smoke
on: [push, pull_request]
jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: setup.sh (deps, example self-check, red/green calibration)
        run: |
          bash setup.sh | tee setup.log
          grep -q '^calibrate OK' setup.log
      - name: self-check suite (sync check, calibration, every harness tool)
        run: bash tools/test.sh
